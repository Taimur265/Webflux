global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'uwg-production'
    environment: 'prod'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # UWG API servers
  - job_name: 'uwg_api'
    static_configs:
      - targets:
          - 'api_1:3000'
          - 'api_2:3000'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL exporter (optional - requires postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: []
          # - 'postgres-exporter:9187'

  # Redis exporter (optional - requires redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: []
          # - 'redis-exporter:9121'

  # Node exporter for system metrics (optional)
  - job_name: 'node'
    static_configs:
      - targets: []
          # - 'node-exporter:9100'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
